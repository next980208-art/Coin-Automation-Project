services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    profiles: ["streaming"]
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_RETENTION_MS: 3600000 
    depends_on:
      - zookeeper

  flink-staging-init:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: coin_project-flink:2.3.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /flink-staging && chmod 777 /flink-staging"]
    volumes:
      - flink_staging:/flink-staging

  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: coin_project-flink:2.3.0
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.bind-address: 0.0.0.0
        python.client.executable: /usr/bin/python3
        python.executable: /usr/bin/python3
    volumes:
      - .:/opt/flink/project
      - flink_staging:/opt/flink/staging

  taskmanager:
    image: coin_project-flink:2.3.0
    user: "0:0"
    depends_on:
      jobmanager:
        condition: service_started
      flink-staging-init:
        condition: service_completed_successfully
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        python.executable: /usr/bin/python3
        taskmanager.numberOfTaskSlots: 1
    volumes:
      - .:/opt/flink/project
      - flink_staging:/opt/flink/staging

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    ports:
      - "8080:8080"
    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      flink-staging-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - .:/opt/airflow/project
      - .:/opt/flink/project
      - airflow_home:/opt/airflow
      - flink_staging:/opt/flink/staging

volumes:
  airflow_home:
  flink_staging:
